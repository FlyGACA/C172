<path d="M 582 114 C 565 90 540 76 510 72 C 480 68 455 76 440 92" fill="none" stroke="url(#arrowBlueG)" stroke-width="3" stroke-linecap="round"/>
<polygon points="434,100 436,86 446,94" fill="#1e40af"/>
<!-- Callout 1: Left AI -->
<circle cx="28" cy="318" r="13" fill="#1e40af" filter="url(#csh)"/>
<text x="28" y="323" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<line x1="38" y1="310" x2="55" y2="280" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 2"/>
<!-- Callout 2: Pitch down -->
<circle cx="116" cy="142" r="13" fill="#1e40af" filter="url(#csh)"/>
<text x="116" y="147" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
