<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>06-03</title>
  <desc>06-03</desc>
<defs>
  <radialGradient id="attBg1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fef3c7"/>
    <stop offset="100%" stop-color="#b45309" stop-opacity="0.15"/>
  </radialGradient>
  <linearGradient id="skyBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e40af"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
  <linearGradient id="groundBrown" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#92400e"/>
    <stop offset="100%" stop-color="#78350f"/>
  </linearGradient>
  <linearGradient id="arrowBlueG" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#1e40af"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
  <linearGradient id="arrowGreenG" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#047857"/>
    <stop offset="100%" stop-color="#10b981"/>
  </linearGradient>
  <clipPath id="leftClip"><circle cx="164" cy="186" r="109"/></clipPath>
  <clipPath id="rightClip"><circle cx="476" cy="186" r="109"/></clipPath>
  <filter id="sh" x="-5%" y="-5%" width="115%" height="115%">
    <feDropShadow dx="1" dy="1.5" stdDeviation="2" flood-color="#1e3a5f" flood-opacity="0.12"/>
  </filter>
  <filter id="csh" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0.5" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.18"/>
  </filter>
</defs>
<rect width="640" height="360" fill="#f0f4f8"/>
