<text x="584" y="83" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<!-- Callout 6: Recovery -->
<circle cx="436" cy="244" r="13" fill="#1e40af" filter="url(#csh)"/>
<text x="436" y="249" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
