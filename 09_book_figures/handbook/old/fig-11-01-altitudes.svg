<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Figure 11-1. Elevation, pressure altitude and density altitude on a hot afternoon</title>
  <desc>Elevation, pressure altitude and density altitude on a hot afternoon: an aerodrome at 1 700 ft above mean sea level, the 1 013 hPa level about 300 ft below it, a thermometer showing 36 °C against the ISA 11 °C, and the aeroplane performing as at 5 000 ft.</desc>
<defs>
  <linearGradient id="atmo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.18"/>
    <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a3a3a3" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#737373" stop-opacity="0.18"/>
  </linearGradient>
  <linearGradient id="mslFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1e40af" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1e40af" stop-opacity="0.03"/>
  </linearGradient>
  <filter id="shA" x="-4%" y="-4%" width="108%" height="108%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
  </filter>
  <filter id="csh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
  </filter>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
</defs>
