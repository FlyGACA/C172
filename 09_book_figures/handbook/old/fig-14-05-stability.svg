<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
<title>A lifted parcel in stable and in conditionally unstable air</title>
<desc>Two height-temperature diagrams: on a stable day the lifted parcel is colder than the surrounding air and sinks back; on a conditionally unstable day it becomes warmer than its surroundings above 6 000 ft and rises by itself.</desc>
