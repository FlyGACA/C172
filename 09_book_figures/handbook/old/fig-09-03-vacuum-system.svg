<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Vacuum instrument system</title>
  <desc>Engine-driven vacuum pump powering attitude and heading indicators</desc>
  <defs>
    <linearGradient id="vacPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="airCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="pumpGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="csh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#f8fafc"/>
  <!-- Air intake arrow -->
  <line x1="12" y1="180" x2="34" y2="180" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <!-- Air filter -->
  <rect x="46" y="150" width="40" height="60" rx="5" fill="url(#gaugeGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <polyline points="52,154 80,160 52,166 80,172 52,178 80,184 52,190 80,196 52,202 80,206" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <!-- Vacuum line to attitude indicator -->
  <polyline points="86,180 120,180 120,105 152,105" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Vacuum line to heading indicator -->
  <polyline points="120,180 120,255 152,255" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flow arrows -->
  <polygon points="150,105 142,100.2 142,109.8" fill="#06b6d4"/>
  <polygon points="150,255 142,250.2 142,259.8" fill="#06b6d4"/>
  <!-- Attitude indicator (horizon) -->
  <circle cx="190" cy="105" r="38" fill="url(#gaugeGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M156,105 a34,34 0 0,1 68,0 z" fill="#dbeafe"/>
  <path d="M156,105 a34,34 0 0,0 68,0 z" fill="#f59e0b" fill-opacity="0.3"/>
  <line x1="156" y1="105" x2="224" y2="105" stroke="#ffffff" stroke-width="2"/>
  <!-- Aircraft symbol on attitude indicator -->
  <polyline points="170,108 184,108 190,114 196,108 210,108" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="190" cy="108" r="2.5" fill="#f59e0b"/>
  <!-- Heading indicator (directional gyro) -->
  <circle cx="190" cy="255" r="38" fill="url(#gaugeGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Compass rose tick marks -->
  <line x1="190.0" y1="221.0" x2="190.0" y2="228.0" stroke="#334155" stroke-width="2.5"/>
  <line x1="207.0" y1="225.6" x2="203.5" y2="231.6" stroke="#334155" stroke-width="1.2"/>
  <line x1="219.4" y1="238.0" x2="213.4" y2="241.5" stroke="#334155" stroke-width="1.2"/>
  <line x1="224.0" y1="255.0" x2="217.0" y2="255.0" stroke="#334155" stroke-width="2.5"/>
  <line x1="219.4" y1="272.0" x2="213.4" y2="268.5" stroke="#334155" stroke-width="1.2"/>
  <line x1="207.0" y1="284.4" x2="203.5" y2="278.4" stroke="#334155" stroke-width="1.2"/>
  <line x1="190.0" y1="289.0" x2="190.0" y2="282.0" stroke="#334155" stroke-width="2.5"/>
  <line x1="173.0" y1="284.4" x2="176.5" y2="278.4" stroke="#334155" stroke-width="1.2"/>
  <line x1="160.6" y1="272.0" x2="166.6" y2="268.5" stroke="#334155" stroke-width="1.2"/>
  <line x1="156.0" y1="255.0" x2="163.0" y2="255.0" stroke="#334155" stroke-width="2.5"/>
  <line x1="160.6" y1="238.0" x2="166.6" y2="241.5" stroke="#334155" stroke-width="1.2"/>
  <line x1="173.0" y1="225.6" x2="176.5" y2="231.6" stroke="#334155" stroke-width="1.2"/>
  <!-- Aircraft symbol on heading indicator -->
  <polygon points="190,236 193,250 206,256 206,260 193,258 192,268 197,272 197,275 190,273 183,275 183,272 188,268 187,258 174,260 174,256 187,250" fill="#334155"/>
  <!-- Exhaust lines from instruments -->
  <polyline points="228,105 262,105 262,180" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="228,255 262,255 262,180" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Main vacuum line to pump -->
  <line x1="262" y1="180" x2="438" y2="180" stroke="#8b5cf6" stroke-width="3.5"/>
  <!-- Flow arrow on main line -->
  <polygon points="310,180 302,175.2 302,184.8" fill="#06b6d4"/>
  <!-- Vacuum relief valve -->
  <line x1="330" y1="180" x2="330" y2="116" stroke="#334155" stroke-width="1.5"/>
  <!-- Vacuum gauge -->
  <circle cx="330" cy="90" r="28" fill="url(#gaugeGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M309.4,105.9 A26,26 0 1,1 350.6,105.9" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M325.1,69.3 A21,21 0 0,1 343.5,73.9" stroke="#047857" stroke-width="5" fill="none" stroke-linecap="round"/>
  <line x1="330" y1="90" x2="336" y2="72" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="330" cy="90" r="3" fill="#334155"/>
  <!-- Vacuum pump exhaust -->
  <line x1="386" y1="181" x2="386" y2="190" stroke="#334155" stroke-width="3"/>
  <rect x="372" y="190" width="28" height="32" rx="4" fill="url(#gaugeGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <polyline points="380,196 392,201 380,206 392,211 380,216" stroke="#334155" stroke-width="1.5" fill="none"/>
  <!-- Exhaust air arrow -->
  <line x1="386" y1="258" x2="386" y2="234" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <!-- Engine compartment -->
  <rect x="420" y="250" width="170" height="80" rx="8" fill="#94a3b8" fill-opacity="0.25" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <!-- Engine mount -->
  <rect x="460" y="212" width="16" height="38" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <!-- Vacuum pump -->
  <circle cx="468" cy="180" r="30" fill="url(#pumpGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Pump internal vanes -->
  <circle cx="472" cy="180" r="18" fill="none" stroke="#334155" stroke-width="1.5"/>
  <line x1="472" y1="180" x2="472" y2="162" stroke="#334155" stroke-width="1.5"/>
  <line x1="472" y1="180" x2="490" y2="180" stroke="#334155" stroke-width="1.5"/>
  <line x1="472" y1="180" x2="472" y2="198" stroke="#334155" stroke-width="1.5"/>
  <line x1="472" y1="180" x2="454" y2="180" stroke="#334155" stroke-width="1.5"/>
  <!-- Exhaust pipe to atmosphere -->
  <polyline points="498,180 560,180 560,120 600,120" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="602" y1="120" x2="616" y2="120" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <!-- Exhaust port -->
  <line x1="600" y1="104" x2="600" y2="136" stroke="#334155" stroke-width="3"/>
  <!-- Callout 1: Air filter -->
  <line x1="66" y1="236" x2="66" y2="210" stroke="#475569" stroke-width="1.2"/><circle cx="66" cy="210" r="2.2" fill="#475569"/><circle cx="66" cy="236" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="66" y="241" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <!-- Callout 2: Attitude indicator -->
  <line x1="190" y1="30" x2="190" y2="67" stroke="#475569" stroke-width="1.2"/><circle cx="190" cy="67" r="2.2" fill="#475569"/><circle cx="190" cy="30" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="190" y="35" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <!-- Callout 3: Heading indicator -->
  <line x1="112" y1="316" x2="160" y2="278" stroke="#475569" stroke-width="1.2"/><circle cx="160" cy="278" r="2.2" fill="#475569"/><circle cx="112" cy="316" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="112" y="321" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <!-- Callout 4: Vacuum gauge -->
  <line x1="382" y1="60" x2="356" y2="80" stroke="#475569" stroke-width="1.2"/><circle cx="356" cy="80" r="2.2" fill="#475569"/><circle cx="382" cy="60" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="382" y="65" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <!-- Callout 5: Vacuum relief -->
  <line x1="350" y1="240" x2="372" y2="218" stroke="#475569" stroke-width="1.2"/><circle cx="372" cy="218" r="2.2" fill="#475569"/><circle cx="350" cy="240" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="350" y="245" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <!-- Callout 6: Vacuum pump -->
  <line x1="518" y1="228" x2="492" y2="198" stroke="#475569" stroke-width="1.2"/><circle cx="492" cy="198" r="2.2" fill="#475569"/><circle cx="518" cy="228" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="518" y="233" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <!-- Callout 7: Exhaust -->
  <line x1="600" y1="84" x2="600" y2="104" stroke="#475569" stroke-width="1.2"/><circle cx="600" cy="104" r="2.2" fill="#475569"/><circle cx="600" cy="84" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="600" y="89" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
</svg>
