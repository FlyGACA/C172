<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
<title>Cross-sections of a cold front, a warm front and an occluded front</title>
<desc>Three vertical cross-sections: a steep cold front with cumulonimbus, a shallow warm front with cirrus, altostratus, nimbostratus and low stratus, and an occluded front with warm air lifted off the ground. Black arrows show the direction of movement.</desc>
