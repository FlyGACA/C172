<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Magnetic compass errors</title>
  <desc>Deviation, variation and acceleration errors affecting compass readings</desc>
  <defs>
    <radialGradient id="compassFace" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="variationAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="deviationBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="csh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#f8fafc"/>
  <!-- Compass rose -->
  <circle cx="175" cy="185" r="112" fill="url(#compassFace)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Compass tick marks -->
  <line x1="175" y1="73" x2="175" y2="85" stroke="#334155" stroke-width="2.5"/>
  <line x1="231" y1="88" x2="227.5" y2="94.1" stroke="#334155" stroke-width="2"/>
  <line x1="272" y1="129" x2="265.9" y2="132.5" stroke="#334155" stroke-width="2"/>
  <line x1="287" y1="185" x2="275" y2="185" stroke="#334155" stroke-width="2.5"/>
  <line x1="272" y1="241" x2="265.9" y2="237.5" stroke="#334155" stroke-width="2"/>
  <line x1="231" y1="282" x2="227.5" y2="275.9" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="297" x2="175" y2="285" stroke="#334155" stroke-width="2.5"/>
  <line x1="119" y1="282" x2="122.5" y2="275.9" stroke="#334155" stroke-width="2"/>
  <line x1="78" y1="241" x2="84.1" y2="237.5" stroke="#334155" stroke-width="2"/>
  <line x1="63" y1="185" x2="75" y2="185" stroke="#334155" stroke-width="2.5"/>
  <line x1="78" y1="129" x2="84.1" y2="132.5" stroke="#334155" stroke-width="2"/>
  <line x1="119" y1="88" x2="122.5" y2="94.1" stroke="#334155" stroke-width="2"/>
  <!-- Degree numbers -->
  <text x="175" y="54" text-anchor="middle" font-size="14" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#334155">360°</text>
  <text x="317" y="190" text-anchor="middle" font-size="14" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#334155">090°</text>
  <text x="175" y="326" text-anchor="middle" font-size="14" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#334155">180°</text>
  <text x="33" y="190" text-anchor="middle" font-size="14" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#334155">270°</text>
  <!-- Variation arcs (amber) -->
  <path d="M 124.2 85.2 A 112 112 0 0 1 175 73" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M 175 297 A 112 112 0 0 1 124.2 284.8" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <!-- Deviation curves (blue) -->
  <path d="M 91.1 182.1 A 84 84 0 0 1 131.7 113" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="136.9,110.2 128.9,120.9 123.4,110.3" fill="#3b82f6"/>
  <path d="M 258.9 187.9 A 84 84 0 0 1 142.2 262.3" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="136.9,259.8 150.3,259.9 144.8,270.6" fill="#3b82f6"/>
  <!-- Variation reference lines (dashed) -->
  <line x1="143.2" y1="122.6" x2="120.5" y2="78.1" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3"/>
  <line x1="143.2" y1="247.4" x2="120.5" y2="291.9" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3"/>
  <!-- Compass center pivot -->
  <circle cx="175" cy="185" r="4" fill="#334155"/>
  <circle cx="175" cy="185" r="2" fill="#64748b"/>
  <!-- Callout 1: Variation (upper) -->
  <line x1="125.1" y1="78.1" x2="115" y2="56.3" stroke="#475569" stroke-width="1.2"/><circle cx="110.3" cy="46.3" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="110.3" y="51" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">1</text>
  <!-- Callout 2: Variation (lower) -->
  <line x1="125.1" y1="291.9" x2="115" y2="313.7" stroke="#475569" stroke-width="1.2"/><circle cx="110.3" cy="323.7" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="110.3" y="328.3" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">2</text>
  <!-- Callout 3: Deviation -->
  <line x1="290.4" y1="172.9" x2="301.4" y2="133.6" stroke="#475569" stroke-width="1.2"/><circle cx="308.4" cy="125.6" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="308.4" y="130.2" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">3</text>
  <!-- Divider line -->
  <line x1="352" y1="24" x2="352" y2="336" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Right panel: Acceleration errors -->
  <!-- Vertical reference line -->
  <line x1="600" y1="112" x2="600" y2="48" stroke="#334155" stroke-width="2.5"/>
  <polygon points="600,40 605,50 595,50" fill="#334155"/>
  <!-- Heading reference -->
  <text x="600" y="132" text-anchor="middle" font-size="14" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#334155">360°</text>
  <!-- Top compass body (Northerly turning error) -->
  <g transform="translate(450,110) rotate(0)">
    <polygon points="-36,-4 26,-4 38,0 26,4 -36,4" fill="#334155"/>
    <polygon points="-6,-4 8,-4 6,-40 -4,-40" fill="#334155"/>
    <polygon points="-6,4 8,4 6,40 -4,40" fill="#334155"/>
    <polygon points="-36,-14 -28,-14 -26,14 -36,14" fill="#334155"/>
  </g>
  <!-- Turn indication arrow (blue) -->
  <line x1="496" y1="110" x2="545.6" y2="110" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <polygon points="556,110 543,116.5 543,103.5" fill="#3b82f6"/>
  <!-- Deviation curve (amber dashed) -->
  <path d="M 470 84 Q 500 56 532 48" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
  <polygon points="536,47 526,55.9 522.9,44.3" fill="#f59e0b"/>
  <!-- Callout 4: Northerly turn -->
  <circle cx="400" cy="64" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="400" y="69" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">4</text>
  <!-- Bottom compass body (Southerly turning Error) -->
  <g transform="translate(450,262) rotate(0)">
    <polygon points="-36,-4 26,-4 38,0 26,4 -36,4" fill="#334155"/>
    <polygon points="-6,-4 8,-4 6,-40 -4,-40" fill="#334155"/>
    <polygon points="-6,4 8,4 6,40 -4,40" fill="#334155"/>
    <polygon points="-36,-14 -28,-14 -26,14 -36,14" fill="#334155"/>
  </g>
  <!-- Turn indication arrow (blue, reversed) -->
  <line x1="556" y1="262" x2="508.4" y2="262" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <polygon points="498,262 511,255.5 511,268.5" fill="#3b82f6"/>
  <!-- Deviation curve (amber dashed) -->
  <path d="M 470 288 Q 500 316 532 324" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
  <polygon points="536,325 522.9,327.7 526,316.1" fill="#f59e0b"/>
  <!-- Callout 5: Southerly turn -->
  <circle cx="400" cy="310" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="400" y="315" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">5</text>
</svg>
