<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Four-stroke engine cycle</title>
  <desc>Intake, compression, power and exhaust strokes of a piston engine</desc>
<defs>
  <linearGradient id="cylWall" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#6b7280"/>
    <stop offset="50%" stop-color="#9ca3af"/>
    <stop offset="100%" stop-color="#6b7280"/>
  </linearGradient>
  <linearGradient id="pistonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#475569"/>
    <stop offset="30%" stop-color="#64748b"/>
    <stop offset="70%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>
  <linearGradient id="intakeFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#bfdbfe"/>
    <stop offset="100%" stop-color="#e8eefc"/>
  </linearGradient>
  <linearGradient id="compressFill" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#e8eefc"/>
    <stop offset="100%" stop-color="#c7d2ee"/>
  </linearGradient>
  <linearGradient id="combustFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f97316"/>
    <stop offset="40%" stop-color="#fbbf24"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="exhaustFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#d1d5db"/>
    <stop offset="100%" stop-color="#9ca3af" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="valveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f0f4ff"/>
    <stop offset="100%" stop-color="#d4d8e0"/>
  </linearGradient>
  <filter id="shd" x="-3%" y="-3%" width="106%" height="106%">
    <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#1e293b" flood-opacity="0.1"/>
  </filter>
  <filter id="csh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
  </filter>
</defs>
<rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

<!-- ====== CYLINDER 1: INTAKE ====== -->
<g filter="url(#shd)">
<!-- Cylinder head -->
<rect x="32" y="62" width="96" height="36.0" rx="3" fill="url(#cylWall)" fill-opacity="0.5" stroke="#475569" stroke-width="2"/>
<!-- Intake chamber (air-fuel mixture entering) -->
<rect x="43" y="98.0" width="74" height="48.7" fill="url(#intakeFill)"/>
<!-- Left valve (intake - open) -->
<rect x="49" y="34" width="18" height="64.0" fill="url(#valveGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="49" y1="34" x2="49" y2="98.0" stroke="#475569" stroke-width="1.5"/><line x1="67" y1="34" x2="67" y2="98.0" stroke="#475569" stroke-width="1.5"/>
<!-- Valve stem -->
<line x1="58" y1="40" x2="58" y2="107.0" stroke="#475569" stroke-width="2.5"/><rect x="47" y="107.0" width="22" height="5" rx="1.5" fill="#475569"/>
<!-- Right valve (closed) -->
<rect x="93" y="34" width="18" height="64.0" fill="url(#valveGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="93" y1="34" x2="93" y2="98.0" stroke="#475569" stroke-width="1.5"/><line x1="111" y1="34" x2="111" y2="98.0" stroke="#475569" stroke-width="1.5"/>
<line x1="102" y1="40" x2="102" y2="94.0" stroke="#475569" stroke-width="2.5"/><rect x="91" y="94.0" width="22" height="5" rx="1.5" fill="#475569"/>
<!-- Spark plug -->
<rect x="76" y="44" width="8" height="54.0" fill="#475569"/><rect x="73" y="38" width="14" height="8" rx="2" fill="#475569"/>
</g>
<!-- Cylinder walls -->
<line x1="42" y1="98.0" x2="42" y2="196" stroke="#475569" stroke-width="3"/><line x1="118" y1="98.0" x2="118" y2="196" stroke="#475569" stroke-width="3"/>
<!-- Crankcase -->
<path d="M42,196 L34,204 L34,266 Q34,282 50,282 L110,282 Q126,282 126,266 L126,204 L118,196" fill="none" stroke="#475569" stroke-width="2"/>
<!-- Piston -->
<rect x="45" y="146.7" width="70" height="30" rx="2" fill="url(#pistonGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="45" y1="152.7" x2="115" y2="152.7" stroke="#475569" stroke-width="1"/>
<line x1="45" y1="157.7" x2="115" y2="157.7" stroke="#475569" stroke-width="1"/>
<!-- Crshaft -->
<circle cx="80" cy="232.0" r="26.0" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="80" y1="164.7" x2="104.4" y2="240.9" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
<line x1="80" y1="232.0" x2="104.4" y2="240.9" stroke="#1e40af" stroke-width="9" stroke-linecap="round"/>
<circle cx="80" cy="164.7" r="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><circle cx="104.4" cy="240.9" r="3.5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><circle cx="80" cy="232.0" r="5" fill="#475569"/>
<!-- Rotation arrow -->
<path d="M116.7,241.8 A38,38 0 0 1 47.1,251.0" fill="none" stroke="#475569" stroke-width="1.6"/><polygon points="45.1,247.5 45.6,255.3 51.6,251.8" fill="#475569"/>
<!-- Piston motion arrow (down) -->
<line x1="138.0" y1="118.0" x2="138.0" y2="158.0" stroke="#1e40af" stroke-width="3"/><polygon points="138.0,168.0 143.0,158.0 133.0,158.0" fill="#1e40af"/>
<!-- Intake air arrow -->
<line x1="58.0" y1="14.0" x2="58.0" y2="42.0" stroke="#1e40af" stroke-width="3"/><polygon points="58.0,52.0 63.0,42.0 53.0,42.0" fill="#1e40af"/>
<!-- Callout 1 -->
<circle cx="80.0" cy="318.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="80.0" y="322.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

<!-- ====== Divider ====== -->
<line x1="160" y1="14" x2="160" y2="346" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

<!-- ====== CYLINDER 2: COMPRESSION ====== -->
<g filter="url(#shd)">
<rect x="192" y="62" width="96" height="36.0" rx="3" fill="url(#cylWall)" fill-opacity="0.5" stroke="#475569" stroke-width="2"/>
<rect x="203" y="98.0" width="74" height="26.2" fill="url(#compressFill)"/>
<rect x="209" y="34" width="18" height="64.0" fill="url(#valveGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="209" y1="34" x2="209" y2="98.0" stroke="#475569" stroke-width="1.5"/><line x1="227" y1="34" x2="227" y2="98.0" stroke="#475569" stroke-width="1.5"/>
<line x1="218" y1="40" x2="218" y2="94.0" stroke="#475569" stroke-width="2.5"/><rect x="207" y="94.0" width="22" height="5" rx="1.5" fill="#475569"/>
<rect x="253" y="34" width="18" height="64.0" fill="url(#valveGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="253" y1="34" x2="253" y2="98.0" stroke="#475569" stroke-width="1.5"/><line x1="271" y1="34" x2="271" y2="98.0" stroke="#475569" stroke-width="1.5"/>
<line x1="262" y1="40" x2="262" y2="94.0" stroke="#475569" stroke-width="2.5"/><rect x="251" y="94.0" width="22" height="5" rx="1.5" fill="#475569"/>
<rect x="236" y="44" width="8" height="54.0" fill="#475569"/><rect x="233" y="38" width="14" height="8" rx="2" fill="#475569"/>
</g>
<line x1="202" y1="98.0" x2="202" y2="196" stroke="#475569" stroke-width="3"/><line x1="278" y1="98.0" x2="278" y2="196" stroke="#475569" stroke-width="3"/>
<path d="M202,196 L194,204 L194,266 Q194,282 210,282 L270,282 Q286,282 286,266 L286,204 L278,196" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="205" y="124.2" width="70" height="30" rx="2" fill="url(#pistonGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="205" y1="130.2" x2="275" y2="130.2" stroke="#475569" stroke-width="1"/>
<line x1="205" y1="135.2" x2="275" y2="135.2" stroke="#475569" stroke-width="1"/>
<circle cx="240" cy="232.0" r="26.0" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="240" y1="142.2" x2="217.5" y2="219.0" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
<line x1="240" y1="232.0" x2="217.5" y2="219.0" stroke="#1e40af" stroke-width="9" stroke-linecap="round"/>
<circle cx="240" cy="142.2" r="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><circle cx="217.5" cy="219.0" r="3.5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><circle cx="240" cy="232.0" r="5" fill="#475569"/>
<path d="M276.7,241.8 A38,38 0 0 1 207.1,251.0" fill="none" stroke="#475569" stroke-width="1.6"/><polygon points="205.1,247.5 205.6,255.3 211.6,251.8" fill="#475569"/>
<!-- Piston motion arrow (up) -->
<line x1="298.0" y1="168.0" x2="298.0" y2="128.0" stroke="#1e40af" stroke-width="3"/><polygon points="298.0,118.0 293.0,128.0 303.0,128.0" fill="#1e40af"/>
<circle cx="240.0" cy="318.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="240.0" y="322.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

<!-- ====== Divider ====== -->
<line x1="320" y1="14" x2="320" y2="346" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

<!-- ====== CYLINDER 3: POWER (combustion) ====== -->
<g filter="url(#shd)">
<rect x="352" y="62" width="96" height="36.0" rx="3" fill="url(#cylWall)" fill-opacity="0.5" stroke="#475569" stroke-width="2"/>
<!-- Combustion chamber fill -->
<rect x="363" y="98.0" width="74" height="26.2" fill="url(#combustFill)"/>
<!-- Spark/ignition symbol -->
<polygon points="411.0,107.0 404.2,108.7 407.8,114.8 401.7,111.2 400.0,118.0 398.3,111.2 392.2,114.8 395.8,108.7 389.0,107.0 395.8,105.3 392.2,99.2 398.3,102.8 400.0,96.0 401.7,102.8 407.8,99.2 404.2,105.3" fill="#f59e0b" opacity="0.9"/>
<rect x="369" y="34" width="18" height="64.0" fill="url(#valveGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="369" y1="34" x2="369" y2="98.0" stroke="#475569" stroke-width="1.5"/><line x1="387" y1="34" x2="387" y2="98.0" stroke="#475569" stroke-width="1.5"/>
<line x1="378" y1="40" x2="378" y2="94.0" stroke="#475569" stroke-width="2.5"/><rect x="367" y="94.0" width="22" height="5" rx="1.5" fill="#475569"/>
<rect x="413" y="34" width="18" height="64.0" fill="url(#valveGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="413" y1="34" x2="413" y2="98.0" stroke="#475569" stroke-width="1.5"/><line x1="431" y1="34" x2="431" y2="98.0" stroke="#475569" stroke-width="1.5"/>
<line x1="422" y1="40" x2="422" y2="94.0" stroke="#475569" stroke-width="2.5"/><rect x="411" y="94.0" width="22" height="5" rx="1.5" fill="#475569"/>
<rect x="396" y="44" width="8" height="54.0" fill="#475569"/><rect x="393" y="38" width="14" height="8" rx="2" fill="#475569"/>
</g>
<line x1="362" y1="98.0" x2="362" y2="196" stroke="#475569" stroke-width="3"/><line x1="438" y1="98.0" x2="438" y2="196" stroke="#475569" stroke-width="3"/>
<path d="M362,196 L354,204 L354,266 Q354,282 370,282 L430,282 Q446,282 446,266 L446,204 L438,196" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="365" y="124.2" width="70" height="30" rx="2" fill="url(#pistonGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="365" y1="130.2" x2="435" y2="130.2" stroke="#475569" stroke-width="1"/>
<line x1="365" y1="135.2" x2="435" y2="135.2" stroke="#475569" stroke-width="1"/>
<circle cx="400" cy="232.0" r="26.0" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="400" y1="142.2" x2="422.5" y2="219.0" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
<line x1="400" y1="232.0" x2="422.5" y2="219.0" stroke="#1e40af" stroke-width="9" stroke-linecap="round"/>
<circle cx="400" cy="142.2" r="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><circle cx="422.5" cy="219.0" r="3.5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><circle cx="400" cy="232.0" r="5" fill="#475569"/>
<path d="M436.7,241.8 A38,38 0 0 1 367.1,251.0" fill="none" stroke="#475569" stroke-width="1.6"/><polygon points="365.1,247.5 365.6,255.3 371.6,251.8" fill="#475569"/>
<!-- Piston motion arrow (down - power) -->
<line x1="458.0" y1="118.0" x2="458.0" y2="158.0" stroke="#1e40af" stroke-width="3"/><polygon points="458.0,168.0 463.0,158.0 453.0,158.0" fill="#1e40af"/>
<circle cx="400.0" cy="318.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="400.0" y="322.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

<!-- ====== Divider ====== -->
<line x1="480" y1="14" x2="480" y2="346" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

<!-- ====== CYLINDER 4: EXHAUST ====== -->
<g filter="url(#shd)">
<rect x="512" y="62" width="96" height="36.0" rx="3" fill="url(#cylWall)" fill-opacity="0.5" stroke="#475569" stroke-width="2"/>
<rect x="523" y="98.0" width="74" height="48.7" fill="url(#exhaustFill)"/>
<rect x="529" y="34" width="18" height="64.0" fill="url(#valveGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="529" y1="34" x2="529" y2="98.0" stroke="#475569" stroke-width="1.5"/><line x1="547" y1="34" x2="547" y2="98.0" stroke="#475569" stroke-width="1.5"/>
<line x1="538" y1="40" x2="538" y2="94.0" stroke="#475569" stroke-width="2.5"/><rect x="527" y="94.0" width="22" height="5" rx="1.5" fill="#475569"/>
<rect x="573" y="34" width="18" height="64.0" fill="url(#valveGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="573" y1="34" x2="573" y2="98.0" stroke="#475569" stroke-width="1.5"/><line x1="591" y1="34" x2="591" y2="98.0" stroke="#475569" stroke-width="1.5"/>
<line x1="582" y1="40" x2="582" y2="107.0" stroke="#475569" stroke-width="2.5"/><rect x="571" y="107.0" width="22" height="5" rx="1.5" fill="#475569"/>
<rect x="556" y="44" width="8" height="54.0" fill="#475569"/><rect x="553" y="38" width="14" height="8" rx="2" fill="#475569"/>
</g>
<line x1="522" y1="98.0" x2="522" y2="196" stroke="#475569" stroke-width="3"/><line x1="598" y1="98.0" x2="598" y2="196" stroke="#475569" stroke-width="3"/>
<path d="M522,196 L514,204 L514,266 Q514,282 530,282 L590,282 Q606,282 606,266 L606,204 L598,196" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="525" y="146.7" width="70" height="30" rx="2" fill="url(#pistonGrad)" stroke="#475569" stroke-width="1.5"/>
<line x1="525" y1="152.7" x2="595" y2="152.7" stroke="#475569" stroke-width="1"/>
<line x1="525" y1="157.7" x2="595" y2="157.7" stroke="#475569" stroke-width="1"/>
<circle cx="560" cy="232.0" r="26.0" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="560" y1="164.7" x2="535.6" y2="240.9" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
<line x1="560" y1="232.0" x2="535.6" y2="240.9" stroke="#1e40af" stroke-width="9" stroke-linecap="round"/>
<circle cx="560" cy="164.7" r="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><circle cx="535.6" cy="240.9" r="3.5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><circle cx="560" cy="232.0" r="5" fill="#475569"/>
<path d="M596.7,241.8 A38,38 0 0 1 527.1,251.0" fill="none" stroke="#475569" stroke-width="1.6"/><polygon points="525.1,247.5 525.6,255.3 531.6,251.8" fill="#475569"/>
<!-- Piston motion arrow (up - exhaust) -->
<line x1="618.0" y1="168.0" x2="618.0" y2="128.0" stroke="#1e40af" stroke-width="3"/><polygon points="618.0,118.0 613.0,128.0 623.0,128.0" fill="#1e40af"/>
<!-- Exhaust gas arrow (up and out) -->
<line x1="582.0" y1="64.0" x2="582.0" y2="26.0" stroke="#94a3b8" stroke-width="3"/><polygon points="582.0,16.0 577.0,26.0 587.0,26.0" fill="#94a3b8"/>
<circle cx="560.0" cy="318.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="560.0" y="322.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

<!-- ====== NUMBERED CALLOUTS ====== -->
<!-- 5: Intake valve -->
<line x1="18.0" y1="60.0" x2="56.0" y2="84.0" stroke="#475569" stroke-width="1.2"/><circle cx="56.0" cy="84.0" r="2.2" fill="#475569"/><circle cx="18.0" cy="60.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="18.0" y="64.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<!-- 6: Exhaust valve -->
<line x1="624.0" y1="60.0" x2="584.0" y2="86.0" stroke="#475569" stroke-width="1.2"/><circle cx="584.0" cy="86.0" r="2.2" fill="#475569"/><circle cx="624.0" cy="60.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="624.0" y="64.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<!-- 7: Spark plug -->
<line x1="366.0" y1="20.0" x2="393.0" y2="42.0" stroke="#475569" stroke-width="1.2"/><circle cx="393.0" cy="42.0" r="2.2" fill="#475569"/><circle cx="366.0" cy="20.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="366.0" y="24.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<!-- 8: Piston -->
<line x1="18.0" y1="170.0" x2="45.0" y2="160.0" stroke="#475569" stroke-width="1.2"/><circle cx="45.0" cy="160.0" r="2.2" fill="#475569"/><circle cx="18.0" cy="170.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="18.0" y="174.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
<!-- 9: Connecting rod -->
<line x1="18.0" y1="214.0" x2="90.0" y2="194.0" stroke="#475569" stroke-width="1.2"/><circle cx="90.0" cy="194.0" r="2.2" fill="#475569"/><circle cx="18.0" cy="214.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="18.0" y="218.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
<!-- 10: Crankshaft -->
<line x1="18.0" y1="262.0" x2="80.0" y2="240.0" stroke="#475569" stroke-width="1.2"/><circle cx="80.0" cy="240.0" r="2.2" fill="#475569"/><circle cx="18.0" cy="262.0" r="13" fill="#1e40af" filter="url(#csh)"/><text x="18.0" y="266.2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
</svg>
