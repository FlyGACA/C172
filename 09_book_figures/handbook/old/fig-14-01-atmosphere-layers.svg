<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
<title>Layers of the atmosphere and the ISA temperature profile</title>
<desc>Height in feet against temperature in degrees Celsius: the ISA falls 15 degrees at sea level to about minus 56 at the tropopause (36 000 ft), then stays constant in the stratosphere; pressure scale on the right.</desc>
