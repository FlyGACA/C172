<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Pitot-static system</title>
  <desc>Pitot tube and static port providing pressure to airspeed, altimeter and VSI</desc>
  <defs>
    <linearGradient id="pitotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="pressureBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="staticGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="dialGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="csh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#f8fafc"/>
  <!-- Wing cross-section -->
  <rect x="20" y="14" width="250" height="14" rx="4" fill="url(#pitotGrad)" filter="url(#shadow)"/>
  <!-- Pitot tube housing -->
  <polygon points="122,28 146,28 142,62 126,62" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
  <!-- Pitot tube body -->
  <rect x="44" y="62" width="130" height="16" rx="2" fill="#dbeafe"/>
  <path d="M 44 62 L 174 62 L 174 78 L 74 78 M 60 78 L 44 78" fill="none" stroke="#334155" stroke-width="2.5"/>
  <path d="M 60 78 L 60 84 M 74 78 L 74 84" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- Drain hole -->
  <line x1="67" y1="80" x2="67" y2="92.4" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="67,98 63.5,91 70.5,91" fill="#94a3b8"/>
  <!-- Pitot tube opening marks -->
  <line x1="44" y1="62" x2="44" y2="65" stroke="#334155" stroke-width="2.5"/>
  <line x1="44" y1="75" x2="44" y2="78" stroke="#334155" stroke-width="2.5"/>
  <!-- Impact pressure arrows (pitot) -->
  <line x1="6" y1="66" x2="33.6" y2="66" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="6" y1="74" x2="33.6" y2="74" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Pitot pressure line to ASI -->
  <path d="M 174 70 L 300 70 L 300 103" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Static port -->
  <rect x="24" y="218" width="150" height="84" rx="8" fill="#dbeafe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <!-- Static port holes -->
  <line x1="40" y1="236" x2="120" y2="236" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="126,236 119,239.5 119,232.5" fill="#94a3b8"/>
  <line x1="40" y1="284" x2="120" y2="284" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="126,284 119,287.5 119,280.5" fill="#94a3b8"/>
  <!-- Static port center -->
  <circle cx="80" cy="260" r="8" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <circle cx="80" cy="260" r="2.6" fill="#334155"/>
  <!-- Static pressure line (green) -->
  <path d="M 88 260 L 560 260" fill="none" stroke="#047857" stroke-width="3.5"/>
  <!-- Branch to altimeter -->
  <line x1="300" y1="260" x2="300" y2="197" stroke="#047857" stroke-width="3.5"/>
  <circle cx="300" cy="260" r="4" fill="#047857"/>
  <!-- Branch to VSI -->
  <line x1="430" y1="260" x2="430" y2="197" stroke="#047857" stroke-width="3.5"/>
  <circle cx="430" cy="260" r="4" fill="#047857"/>
  <!-- Branch to ASI static -->
  <line x1="560" y1="260" x2="560" y2="197" stroke="#047857" stroke-width="3.5"/>
  <circle cx="560" cy="260" r="4" fill="#047857"/>
  <!-- Drain/alternate static -->
  <line x1="220" y1="260" x2="220" y2="324" stroke="#047857" stroke-width="3.5"/>
  <circle cx="220" cy="260" r="4" fill="#047857"/>
  <!-- Alternate static valve -->
  <polygon points="208,286 232,286 220,298 208,310 232,310 220,298" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <line x1="220" y1="298" x2="246" y2="298" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Alternate static arrow -->
  <path d="M 212 332 L 220 324 L 228 332" fill="none" stroke="#047857" stroke-width="3"/>
  <line x1="220" y1="352" x2="220" y2="341.6" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="220,336 223.5,343 216.5,343" fill="#94a3b8"/>
  <!-- Altimeter -->
  <circle cx="300" cy="150" r="45" fill="url(#dialGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Altimeter tick marks -->
  <line x1="300" y1="107" x2="300" y2="113" stroke="#334155" stroke-width="1.5"/>
  <line x1="321.5" y1="112.8" x2="318.5" y2="118" stroke="#334155" stroke-width="1.5"/>
  <line x1="337.2" y1="128.5" x2="332" y2="131.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="343" y1="150" x2="337" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="337.2" y1="171.5" x2="332" y2="168.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="321.5" y1="187.2" x2="318.5" y2="182" stroke="#334155" stroke-width="1.5"/>
  <line x1="300" y1="193" x2="300" y2="187" stroke="#334155" stroke-width="1.5"/>
  <line x1="278.5" y1="187.2" x2="281.5" y2="182" stroke="#334155" stroke-width="1.5"/>
  <line x1="262.8" y1="171.5" x2="268" y2="168.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="257" y1="150" x2="263" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="262.8" y1="128.5" x2="268" y2="131.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="278.5" y1="112.8" x2="281.5" y2="118" stroke="#334155" stroke-width="1.5"/>
  <!-- Altimeter arcs -->
  <path d="M 334.8 137.3 A 37 37 0 0 1 287.3 184.8" fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <path d="M 287.3 184.8 A 37 37 0 0 1 265.2 162.7" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <!-- Altimeter needles -->
  <line x1="300" y1="150" x2="327.7" y2="166" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="150" r="4" fill="#334155"/>
  <!-- VSI (Vertical Speed Indicator) -->
  <circle cx="430" cy="150" r="45" fill="url(#dialGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- VSI tick marks -->
  <line x1="430" y1="107" x2="430" y2="113" stroke="#334155" stroke-width="1.5"/>
  <line x1="451.5" y1="112.8" x2="448.5" y2="118" stroke="#334155" stroke-width="1.5"/>
  <line x1="467.2" y1="128.5" x2="462" y2="131.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="473" y1="150" x2="467" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="467.2" y1="171.5" x2="462" y2="168.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="451.5" y1="187.2" x2="448.5" y2="182" stroke="#334155" stroke-width="1.5"/>
  <line x1="430" y1="193" x2="430" y2="187" stroke="#334155" stroke-width="1.5"/>
  <line x1="408.5" y1="187.2" x2="411.5" y2="182" stroke="#334155" stroke-width="1.5"/>
  <line x1="392.8" y1="171.5" x2="398" y2="168.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="387" y1="150" x2="393" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="392.8" y1="128.5" x2="398" y2="131.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="408.5" y1="112.8" x2="411.5" y2="118" stroke="#334155" stroke-width="1.5"/>
  <!-- VSI numbers -->
  <text x="430" y="125" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">0</text>
  <text x="447" y="130.5" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">1</text>
  <text x="457.6" y="145" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">2</text>
  <text x="457.6" y="163" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">3</text>
  <text x="447" y="177.5" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">4</text>
  <text x="430" y="183" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">5</text>
  <text x="413" y="177.5" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">6</text>
  <text x="402.4" y="163" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">7</text>
  <text x="402.4" y="145" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">8</text>
  <text x="413" y="130.5" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="#334155">9</text>
  <!-- VSI needles -->
  <line x1="430" y1="150" x2="461.9" y2="138.4" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="430" cy="150" r="4" fill="#334155"/>
  <line x1="430" y1="150" x2="412.7" y2="140" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="430" cy="150" r="4" fill="#334155"/>
  <!-- ASI (Airspeed Indicator) -->
  <circle cx="560" cy="150" r="45" fill="url(#dialGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- ASI tick marks -->
  <line x1="560" y1="107" x2="560" y2="113" stroke="#334155" stroke-width="1.5"/>
  <line x1="581.5" y1="112.8" x2="578.5" y2="118" stroke="#334155" stroke-width="1.5"/>
  <line x1="597.2" y1="128.5" x2="592" y2="131.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="603" y1="150" x2="597" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="597.2" y1="171.5" x2="592" y2="168.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="581.5" y1="187.2" x2="578.5" y2="182" stroke="#334155" stroke-width="1.5"/>
  <line x1="560" y1="193" x2="560" y2="187" stroke="#334155" stroke-width="1.5"/>
  <line x1="538.5" y1="187.2" x2="541.5" y2="182" stroke="#334155" stroke-width="1.5"/>
  <line x1="522.8" y1="171.5" x2="528" y2="168.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="517" y1="150" x2="523" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="522.8" y1="128.5" x2="528" y2="131.5" stroke="#334155" stroke-width="1.5"/>
  <line x1="538.5" y1="112.8" x2="541.5" y2="118" stroke="#334155" stroke-width="1.5"/>
  <!-- ASI zero mark -->
  <text x="527" y="154" text-anchor="middle" font-size="12" font-family="IBM Plex Sans, sans-serif" fill="#334155">0</text>
  <!-- ASI needle -->
  <line x1="560" y1="150" x2="536" y2="150" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle cx="560" cy="150" r="4" fill="#334155"/>
  <!-- Callout 1: Pitot tube -->
  <line x1="150" y1="78" x2="150" y2="98" stroke="#475569" stroke-width="1.2"/><circle cx="150" cy="108" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="150" y="113" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">1</text>
  <!-- Callout 2: Drain hole -->
  <line x1="76" y1="92" x2="92" y2="108" stroke="#475569" stroke-width="1.2"/><circle cx="100" cy="116" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="100" y="121" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">2</text>
  <!-- Callout 3: Static port -->
  <line x1="86" y1="266" x2="96" y2="286" stroke="#475569" stroke-width="1.2"/><circle cx="102" cy="296" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="102" y="301" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">3</text>
  <!-- Callout 4: Alt static valve -->
  <line x1="234" y1="300" x2="260" y2="312" stroke="#475569" stroke-width="1.2"/><circle cx="270" cy="316" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="270" y="321" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">4</text>
  <!-- Callout 5: Altimeter -->
  <line x1="332" y1="118" x2="343" y2="105" stroke="#475569" stroke-width="1.2"/><circle cx="350" cy="97" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="350" y="102" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">5</text>
  <!-- Callout 6: VSI -->
  <line x1="462" y1="118" x2="473" y2="105" stroke="#475569" stroke-width="1.2"/><circle cx="480" cy="97" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="480" y="102" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">6</text>
  <!-- Callout 7: ASI -->
  <line x1="592" y1="118" x2="603" y2="105" stroke="#475569" stroke-width="1.2"/><circle cx="610" cy="97" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="610" y="102" text-anchor="middle" font-size="15" font-weight="bold" font-family="IBM Plex Sans, sans-serif" fill="#ffffff">7</text>
</svg>
