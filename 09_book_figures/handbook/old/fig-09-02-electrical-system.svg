<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Aircraft electrical system</title>
  <desc>Battery, alternator, bus bar and essential electrical components</desc>
  <defs>
    <linearGradient id="battBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="battAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="altGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="csh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#f8fafc"/>
  <!-- Battery group area -->
  <rect x="20" y="22" width="190" height="96" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Battery cell 1 -->
  <circle cx="55" cy="62" r="17" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="46" y="56" width="9" height="12" rx="1" fill="url(#battBlue)"/>
  <rect x="55" y="56" width="9" height="12" rx="1" fill="url(#battAmber)"/>
  <line x1="55" y1="79" x2="55" y2="96" stroke="#334155" stroke-width="1.5"/>
  <!-- Battery cell 2 -->
  <circle cx="105" cy="62" r="17" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96" y="56" width="9" height="12" rx="1" fill="url(#battBlue)"/>
  <rect x="105" y="56" width="9" height="12" rx="1" fill="url(#battAmber)"/>
  <line x1="105" y1="79" x2="105" y2="96" stroke="#334155" stroke-width="1.5"/>
  <!-- Battery interconnect -->
  <polyline points="55,96 160,96" stroke="#334155" stroke-width="2.5" fill="none"/>
  <!-- Master switch -->
  <circle cx="170" cy="62" r="13" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <line x1="170" y1="62" x2="178" y2="52" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <polyline points="160,96 170,96 170,75" stroke="#334155" stroke-width="2" fill="none"/>
  <!-- Ground symbol -->
  <line x1="190" y1="62" x2="190" y2="68" stroke="#334155" stroke-width="1.5"/>
  <line x1="182" y1="68" x2="198" y2="68" stroke="#334155" stroke-width="2"/>
  <line x1="185" y1="71" x2="195" y2="71" stroke="#334155" stroke-width="1.5"/>
  <line x1="188" y1="74" x2="192" y2="74" stroke="#334155" stroke-width="1"/>
  <!-- Battery lead -->
  <line x1="183" y1="62" x2="190" y2="62" stroke="#334155" stroke-width="1.5"/>
  <!-- Generator/Alternator -->
  <rect x="40" y="190" width="64" height="64" rx="5" fill="url(#altGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <line x1="54" y1="204" x2="54" y2="240" stroke="#334155" stroke-width="2"/>
  <line x1="62" y1="213" x2="62" y2="231" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="82" y1="204" x2="82" y2="240" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="213" x2="90" y2="231" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="62" y1="222" x2="82" y2="222" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- +/- terminals -->
  <text x="47" y="204" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">+</text>
  <text x="97" y="204" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">−</text>
  <!-- Generator output wire -->
  <polyline points="54,190 54,170 133,170" stroke="#1e40af" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <!-- Generator ground -->
  <line x1="90" y1="254" x2="90" y2="260" stroke="#334155" stroke-width="1.5"/>
  <line x1="82" y1="260" x2="98" y2="260" stroke="#334155" stroke-width="1.5"/>
  <line x1="85" y1="263" x2="95" y2="263" stroke="#334155" stroke-width="1.5"/>
  <line x1="88" y1="266" x2="92" y2="266" stroke="#334155" stroke-width="1.5"/>
  <!-- Voltage regulator -->
  <rect x="133" y="156" width="34" height="28" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <path d="M139,176 q4,-12 8,0 q4,-12 8,0 q4,-12 8,0" stroke="#1e40af" stroke-width="1.5" fill="none"/>
  <!-- Wire to ammeter -->
  <line x1="167" y1="170" x2="222" y2="170" stroke="#1e40af" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="200" cy="170" r="3" fill="#1e40af"/>
  <!-- Ammeter -->
  <circle cx="240" cy="170" r="18" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <line x1="240" y1="170" x2="250" y2="158" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <text x="252" y="186" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">+</text>
  <text x="228" y="186" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">−</text>
  <!-- Main bus bar -->
  <line x1="258" y1="170" x2="290" y2="170" stroke="#1e40af" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="290" y1="170" x2="600" y2="170" stroke="url(#busGrad)" stroke-width="9" stroke-linecap="round" filter="url(#shadow)"/>
  <!-- Circuit breaker 1 -->
  <line x1="318" y1="166" x2="318" y2="138.5" stroke="#334155" stroke-width="2"/>
  <path d="M316,131 a9,9 0 0,1 18,0" stroke="#334155" stroke-width="2" fill="none"/>
  <circle cx="318" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <circle cx="332" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <line x1="332" y1="133.5" x2="332" y2="96" stroke="#334155" stroke-width="2"/>
  <!-- Circuit breaker 2 -->
  <line x1="373" y1="166" x2="373" y2="138.5" stroke="#334155" stroke-width="2"/>
  <path d="M371,131 a9,9 0 0,1 18,0" stroke="#334155" stroke-width="2" fill="none"/>
  <circle cx="373" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <circle cx="387" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <line x1="387" y1="133.5" x2="387" y2="96" stroke="#334155" stroke-width="2"/>
  <!-- Circuit breaker 3 -->
  <line x1="428" y1="166" x2="428" y2="138.5" stroke="#334155" stroke-width="2"/>
  <path d="M426,131 a9,9 0 0,1 18,0" stroke="#334155" stroke-width="2" fill="none"/>
  <circle cx="428" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <circle cx="442" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <line x1="442" y1="133.5" x2="442" y2="96" stroke="#334155" stroke-width="2"/>
  <!-- Circuit breaker 4 -->
  <line x1="483" y1="166" x2="483" y2="138.5" stroke="#334155" stroke-width="2"/>
  <path d="M481,131 a9,9 0 0,1 18,0" stroke="#334155" stroke-width="2" fill="none"/>
  <circle cx="483" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <circle cx="497" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <line x1="497" y1="133.5" x2="497" y2="96" stroke="#334155" stroke-width="2"/>
  <!-- Circuit breaker 5 -->
  <line x1="538" y1="166" x2="538" y2="138.5" stroke="#334155" stroke-width="2"/>
  <path d="M536,131 a9,9 0 0,1 18,0" stroke="#334155" stroke-width="2" fill="none"/>
  <circle cx="538" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <circle cx="552" cy="136" r="2.5" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <line x1="552" y1="133.5" x2="552" y2="96" stroke="#334155" stroke-width="2"/>
  <!-- Load 1: Motor -->
  <circle cx="332" cy="78" r="16" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <line x1="321" y1="67" x2="343" y2="89" stroke="#334155" stroke-width="1.5"/>
  <line x1="321" y1="89" x2="343" y2="67" stroke="#334155" stroke-width="1.5"/>
  <!-- Load 2: Light -->
  <rect x="369" y="62" width="36" height="32" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="375" y="68" width="18" height="9" rx="2" fill="#047857"/>
  <circle cx="397" cy="85" r="3.5" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- Load 3: Gauge -->
  <circle cx="442" cy="78" r="16" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <path d="M431,84 a12,12 0 0,1 22,0" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <line x1="442" y1="86" x2="449" y2="72" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Load 4: Radio -->
  <polyline points="497,96 497,92 489,88 505,82 489,76 505,70 489,64 497,60" stroke="#334155" stroke-width="2" fill="none"/>
  <!-- Load 5: Instrument -->
  <circle cx="552" cy="78" r="16" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="552" cy="78" r="6" fill="none" stroke="#334155" stroke-width="1.5"/>
  <line x1="542" y1="78" x2="562" y2="78" stroke="#334155" stroke-width="1.5"/>
  <!-- Wire to master solenoid -->
  <line x1="200" y1="170" x2="200" y2="222" stroke="#1e40af" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Master solenoid/relay -->
  <rect x="183" y="222" width="34" height="26" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <path d="M189,242 q4,-12 8,0 q4,-12 8,0 q4,-12 8,0" stroke="#1e40af" stroke-width="1.5" fill="none"/>
  <line x1="200" y1="248" x2="200" y2="270" stroke="#334155" stroke-width="2"/>
  <!-- Ammeter for battery -->
  <circle cx="200" cy="288" r="18" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="200" cy="288" r="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="200" y1="306" x2="200" y2="312" stroke="#334155" stroke-width="1.5"/>
  <line x1="192" y1="312" x2="208" y2="312" stroke="#334155" stroke-width="1.5"/>
  <line x1="195" y1="315" x2="205" y2="315" stroke="#334155" stroke-width="1.5"/>
  <line x1="198" y1="318" x2="202" y2="318" stroke="#334155" stroke-width="1.5"/>
  <!-- Alternator output wire -->
  <line x1="440" y1="174" x2="440" y2="266" stroke="#1e40af" stroke-width="2.5" filter="url(#glow)"/>
  <polygon points="440,190 435.2,198 444.8,198" fill="#1e40af"/>
  <!-- Alternator -->
  <circle cx="440" cy="290" r="24" fill="url(#altGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <path d="M426,290 q7,-14 14,0 q7,14 14,0" stroke="#334155" stroke-width="2" fill="none"/>
  <line x1="440" y1="314" x2="440" y2="320" stroke="#334155" stroke-width="1.5"/>
  <line x1="432" y1="320" x2="448" y2="320" stroke="#334155" stroke-width="1.5"/>
  <line x1="435" y1="323" x2="445" y2="323" stroke="#334155" stroke-width="1.5"/>
  <line x1="438" y1="326" x2="442" y2="326" stroke="#334155" stroke-width="1.5"/>
  <!-- Voltage regulator box -->
  <rect x="500" y="222" width="56" height="38" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <polyline points="507,250 517,232 527,250 537,232 547,250" stroke="#1e40af" stroke-width="1.5" fill="none"/>
  <!-- Wire from bus to regulator -->
  <line x1="528" y1="174" x2="528" y2="222" stroke="#1e40af" stroke-width="1.5"/>
  <!-- Wire from regulator to alternator -->
  <polyline points="500,250 480,250 460,275" stroke="#1e40af" stroke-width="1.5" fill="none"/>
  <!-- External power lead -->
  <line x1="556" y1="241" x2="584" y2="241" stroke="#334155" stroke-width="1.5"/>
  <circle cx="596" cy="241" r="12" fill="#f59e0b" fill-opacity="0.35" stroke="#334155" stroke-width="2"/>
  <line x1="588" y1="233" x2="604" y2="249" stroke="#334155" stroke-width="1.5"/>
  <line x1="588" y1="249" x2="604" y2="233" stroke="#334155" stroke-width="1.5"/>
  <!-- Navigation lights -->
  <rect x="256" y="296" width="30" height="40" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="286" y="296" width="30" height="40" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="261" y="301" width="20" height="14" rx="2" fill="#334155"/>
  <rect x="291" y="301" width="20" height="14" rx="2" fill="#334155"/>
  <!-- Dash lines to loads -->
  <polyline points="271,336 271,346 150,346 150,184" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <polyline points="301,336 301,346 528,346 528,260" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <!-- Callout 1: Battery -->
  <line x1="22" y1="222" x2="40" y2="222" stroke="#475569" stroke-width="1.2"/><circle cx="40" cy="222" r="2.2" fill="#475569"/><circle cx="22" cy="222" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="22" y="227" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <!-- Callout 2: Battery ground -->
  <line x1="340" y1="316" x2="316" y2="316" stroke="#475569" stroke-width="1.2"/><circle cx="316" cy="316" r="2.2" fill="#475569"/><circle cx="340" cy="316" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="340" y="321" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <!-- Callout 3: Voltage regulator -->
  <line x1="150" y1="128" x2="150" y2="156" stroke="#475569" stroke-width="1.2"/><circle cx="150" cy="156" r="2.2" fill="#475569"/><circle cx="150" cy="128" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="150" y="133" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <!-- Callout 4: Ammeter -->
  <line x1="240" y1="128" x2="240" y2="152" stroke="#475569" stroke-width="1.2"/><circle cx="240" cy="152" r="2.2" fill="#475569"/><circle cx="240" cy="128" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="240" y="133" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <!-- Callout 5: Alternator -->
  <line x1="392" y1="300" x2="416" y2="294" stroke="#475569" stroke-width="1.2"/><circle cx="416" cy="294" r="2.2" fill="#475569"/><circle cx="392" cy="300" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="392" y="305" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <!-- Callout 6: External power -->
  <line x1="616" y1="296" x2="556" y2="256" stroke="#475569" stroke-width="1.2"/><circle cx="556" cy="256" r="2.2" fill="#475569"/><circle cx="616" cy="296" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="616" y="301" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <!-- Callout 7: Bus bar connection -->
  <line x1="616" y1="206" x2="598" y2="229" stroke="#475569" stroke-width="1.2"/><circle cx="598" cy="229" r="2.2" fill="#475569"/><circle cx="616" cy="206" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="616" y="211" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <!-- Callout 8: Circuit breaker -->
  <line x1="360" y1="206" x2="360" y2="172" stroke="#475569" stroke-width="1.2"/><circle cx="360" cy="172" r="2.2" fill="#475569"/><circle cx="360" cy="206" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="360" y="211" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <!-- Callout 9: Master relay -->
  <line x1="300" y1="108" x2="316" y2="128" stroke="#475569" stroke-width="1.2"/><circle cx="316" cy="128" r="2.2" fill="#475569"/><circle cx="300" cy="108" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="300" y="113" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <!-- Callout 10: Battery monitor -->
  <line x1="160" y1="290" x2="182" y2="288" stroke="#475569" stroke-width="1.2"/><circle cx="182" cy="288" r="2.2" fill="#475569"/><circle cx="160" cy="290" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="160" y="295" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
  <!-- Callout 11: Master switch -->
  <line x1="115" y1="18" x2="105" y2="45" stroke="#475569" stroke-width="1.2"/><circle cx="105" cy="45" r="2.2" fill="#475569"/><circle cx="115" cy="18" r="13" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#csh)"/><text x="115" y="23" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">11</text>
</svg>
