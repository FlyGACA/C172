<?xml version="1.0" encoding="UTF-8"?>
<svg id="art" viewBox="0 0 1600 930" role="img" aria-label="Airspeed indicator colour markings" xmlns="http://www.w3.org/2000/svg"><style>:root{
  --ink: #1d2733;          /* lines and text */
  --ink-soft: #55616f;     /* secondary text, leaders */
  --hair: #aab4bf;         /* hairlines, inactive outlines */
  --paper: #ffffff;
  --wash: #eef1f4;         /* neutral component fill */
  --fuel: #2f7fc1;         /* 100LL is dyed blue */
  --fuel-wash: #cfe3f3;
  --normal: #2e9e6b;       /* green arc / normal */
  --caution: #e0a100;      /* yellow arc / caution */
  --limit: #cf3a2f;        /* red line / limit */
  --dial: #15181c;         /* instrument face */
  --bezel: #3a4048;
}
/* ---------- inside the artwork ---------- */
svg text { font-family: "IBM Plex Sans Arabic", sans-serif; fill: var(--ink); }
.label { font-size: 30px; font-weight: 400; }
.label-strong { font-weight: 600; }
.label-small { font-size: 24px; fill: var(--ink-soft); }
.label-tiny { font-size: 21px; fill: var(--ink-soft); }
.label-inverse { fill: #ffffff; }
.heading { font-size: 25px; font-weight: 600; letter-spacing: .06em; fill: var(--ink-soft); }

.leader-halo { fill: none; stroke: var(--paper); stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
.leader { fill: none; stroke: var(--ink-soft); stroke-width: 2.6; stroke-linejoin: round; }
.leader-dot { fill: var(--ink); stroke: var(--paper); stroke-width: 2.5; }
.outline { fill: var(--wash); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
.outline-thin { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.hairline { fill: none; stroke: var(--hair); stroke-width: 2.4; }
.arrow { fill: var(--ink); }
/* fill modifiers: used with .outline (they come later, so they win over its default wash) */
.f-none { fill: none; } .f-paper { fill: var(--paper); } .f-fuel { fill: var(--fuel-wash); } .f-ink { fill: var(--ink); } .f-limit { fill: var(--limit); }

/* schematic line codes */
.pipe-fuel { fill: none; stroke: var(--fuel); stroke-width: 15; stroke-linejoin: round; stroke-linecap: butt; }
.pipe-fuel-thin { fill: none; stroke: var(--fuel); stroke-width: 7; stroke-linejoin: round; }
.pipe-vent { fill: none; stroke: var(--ink-soft); stroke-width: 13; stroke-linejoin: round; }
.pipe-vent-core { fill: none; stroke: var(--paper); stroke-width: 7.5; stroke-linejoin: round; }
.wire { fill: none; stroke: var(--ink-soft); stroke-width: 2.8; stroke-dasharray: 11 8; }
.linkage { fill: none; stroke: var(--ink-soft); stroke-width: 2.8; stroke-dasharray: 22 7 4 7; }
.fuel-fill { fill: var(--fuel-wash); }
.arrow-fuel { fill: #ffffff; }
.note-box { fill: #f6f8fa; stroke: var(--hair); stroke-width: 2.4; }

/* instrument faces */
.dial-bezel { fill: var(--bezel); stroke: var(--ink); stroke-width: 3; }
.dial-face { fill: var(--dial); }
.dial-tick { stroke: #f2f3f4; stroke-width: 3.2; }
.dial-tick-major { stroke: #f2f3f4; stroke-width: 5.5; }
.dial-number { fill: #f2f3f4; font-size: 37px; font-weight: 600; }
.dial-caption { fill: #c9ced4; font-size: 18px; letter-spacing: .14em; }
.dial-needle { fill: #f2f3f4; stroke: #0b0d10; stroke-width: 1.5; }
.dial-hub { fill: #23272d; stroke: #5b626b; stroke-width: 2.5; }
.arc-white { stroke: #f4f5f6; } .arc-green { stroke: var(--normal); } .arc-yellow { stroke: var(--caution); } .arc-red { stroke: var(--limit); }
.speed-tag rect { fill: var(--paper); stroke: var(--ink); stroke-width: 2.4; }
.speed-tag text { font-size: 23px; font-weight: 600; }
.swatch { stroke: var(--ink); stroke-width: 2.4; }
</style><title>Airspeed indicator colour markings</title><g class="dial"><circle cx="800" cy="442" r="322" class="dial-bezel"/><circle cx="800" cy="442" r="294" class="dial-face"/><path d="M910.84 267.18 A207 207 0 0 1 941.5 593.08" class="arc-white" fill="none" stroke-width="24"/><path d="M971.54 279.92 A236 236 0 1 1 597.71 563.55" class="arc-green" fill="none" stroke-width="24"/><path d="M597.71 563.55 A236 236 0 0 1 633.12 275.12" class="arc-yellow" fill="none" stroke-width="24"/><line x1="927" y1="222.02954743875256" x2="944" y2="192.58468371008166" class="dial-tick-major"/><line x1="1016.1271539436854" y1="283.5290142385599" x2="1032.256046029035" y2="271.70282127128826" class="dial-tick"/><line x1="1047.9791858084632" y1="387.02433805972186" x2="1081.173250050541" y2="379.66539118582637" class="dial-tick-major"/><line x1="1062.8504551480657" y1="494.2842063003223" x2="1082.4661607561304" y2="498.18601274064486" class="dial-tick"/><line x1="1008.0646192494039" y1="587.6884148331657" x2="1035.9157887552296" y2="607.1900136691012" class="dial-tick-major"/><line x1="939.0312331870198" y1="671.1163813403496" x2="949.4066983502303" y2="688.2146187538085" class="dial-tick"/><line x1="833.1536528238931" y1="693.8269947889478" x2="837.5915433593749" y2="727.5361200756574" class="dial-tick-major"/><line x1="725.0058242396941" y1="699.2933609754289" x2="719.4092439590743" y2="718.4943580631475" class="dial-tick"/><line x1="636.731947139619" y1="636.5752885522204" x2="614.8771684102767" y2="662.6207996182657" class="dial-tick-major"/><line x1="559.6381052692395" y1="560.5333689786924" x2="541.7006504385859" y2="569.3791427830724" class="dial-tick"/><line x1="546.2417517182081" y1="453.07932439079536" x2="512.2741121844249" y2="454.5623835612168" class="dial-tick-major"/><line x1="550.22189103221" y1="344.866605739968" x2="531.5817336465541" y2="337.617844974294" class="dial-tick"/><line x1="620.3948775786168" y1="262.39487757861696" x2="596.3532470182743" y2="238.35324701827437" class="dial-tick-major"/><line x1="636.8519370256628" y1="229.38130480194903" x2="624.6767084454884" y2="213.51423799612434" class="dial-tick"/><line x1="672.9999999999999" y1="222.02954743875264" x2="655.9999999999999" y2="192.58468371008175" class="dial-tick-major"/><line x1="697.440840126156" y1="194.40028528697513" x2="689.7871714788542" y2="175.92269463674938" class="dial-tick"/><line x1="734.2599625439598" y1="196.65484012257664" x2="725.460115010474" y2="163.81336202874832" class="dial-tick-major"/><line x1="662.1141776686231" y1="304.11417766862326" x2="596.3532470182743" y2="238.35324701827437" class="arc-red" stroke-width="11"/><text x="878.5" y="319.03401160584315" class="dial-number" text-anchor="middle" direction="ltr">40</text><text x="953.2784731178295" y="421.01898061171784" class="dial-number" text-anchor="middle" direction="ltr">60</text><text x="928.6068709533718" y="545.0515005071142" class="dial-number" text-anchor="middle" direction="ltr">80</text><text x="820.4926121785481" y="610.6568432356883" class="dial-number" text-anchor="middle" direction="ltr">100</text><text x="699.0823452792133" y="575.2689775696796" class="dial-number" text-anchor="middle" direction="ltr">120</text><text x="643.1494292116483" y="461.84824381635775" class="dial-number" text-anchor="middle" direction="ltr">140</text><text x="688.984235353712" y="343.98423535371205" class="dial-number" text-anchor="middle" direction="ltr">160</text><text x="800" y="504" class="dial-caption" text-anchor="middle" direction="ltr">AIRSPEED</text><text x="800" y="530" class="dial-caption" text-anchor="middle" direction="ltr">KNOTS</text><path d="M-7 34 L-7 -196 L0 -226 L7 -196 L7 34 Z" class="dial-needle" transform="translate(800 442) rotate(0)"/><circle cx="800" cy="442" r="22" class="dial-hub"/></g><line x1="973.4885010023784" y1="168.36202745242434" x2="986.3395010766286" y2="148.0925480044558" class="outline-thin"/><g class="speed-tag"><rect rx="18" height="38" x="961.0194493735614" y="91.93183568318011" width="97.76043701171875"/><text class="label" text-anchor="middle" direction="ltr"><tspan x="1009.9" y="118.93">V<tspan dy="4.6" font-size="16.56">S0</tspan><tspan dy="-4.6"> 41</tspan></tspan></text></g><line x1="1035.5073056905594" y1="219.48638476180062" x2="1052.9522912972675" y2="203.0038947441562" class="outline-thin"/><g class="speed-tag"><rect rx="18" height="38" x="1036.0545769212845" y="153.7859963784748" width="97.7603759765625"/><text class="label" text-anchor="middle" direction="ltr"><tspan x="1084.93" y="180.79">V<tspan dy="4.6" font-size="16.56">S1</tspan><tspan dy="-4.6"> 47</tspan></tspan></text></g><line x1="1021.4839058554104" y1="678.4759595540986" x2="1037.8901211039592" y2="695.9926972988467" class="outline-thin"/><g class="speed-tag"><rect rx="18" height="38" x="1019.3773620804657" y="709.1067164975515" width="97.181640625"/><text class="label" text-anchor="middle" direction="ltr"><tspan x="1067.97" y="736.11">V<tspan dy="4.6" font-size="16.56">FE</tspan><tspan dy="-4.6"> 85</tspan></tspan></text></g><line x1="522.2777945725156" y1="608.8723362708577" x2="501.70577935566496" y2="621.2332500686989" class="outline-thin"/><g class="speed-tag"><rect rx="18" height="38" x="406.3869635349283" y="624.8949253647413" width="115.2069091796875"/><text class="label" text-anchor="middle" direction="ltr"><tspan x="463.99" y="651.89">V<tspan dy="4.6" font-size="16.56">NO</tspan><tspan dy="-4.6"> 128</tspan></tspan></text></g><line x1="570.8974028955586" y1="212.89740289555866" x2="553.9268401470814" y2="195.92684014708152" class="outline-thin"/><g class="speed-tag"><rect rx="18" height="38" x="466.14089348385767" y="145.81414177487346" width="113.34649658203125"/><text class="label" text-anchor="middle" direction="ltr"><tspan x="522.81" y="172.81">V<tspan dy="4.6" font-size="16.56">NE</tspan><tspan dy="-4.6"> 160</tspan></tspan></text></g><g><g class="callout" transform="translate(400.0 260.8)"><text class="label label-strong" text-anchor="end" direction="ltr"><tspan x="0" y="0">Red line · 160 KIAS</tspan></text><text class="label-small" text-anchor="end" direction="ltr"><tspan x="0" y="38.09">V<tspan dy="4.8" font-size="17.28">NE</tspan><tspan dy="-4.8"> — never exceed</tspan></tspan></text></g><g class="callout" transform="translate(400.0 441.4)"><text class="label label-strong" text-anchor="end" direction="ltr"><tspan x="0" y="0">Yellow arc · 128–160 KIAS</tspan></text><text class="label-small" text-anchor="end" direction="ltr"><tspan x="0" y="38.09">Caution range</tspan><tspan x="0" y="67.37">Smooth air only</tspan></text></g><path class="leader-halo" d="M414.0 248.3 L448.0 248.3 L606.3 248.3"/><path class="leader" d="M414.0 248.3 L448.0 248.3 L606.3 248.3"/><circle class="leader-dot" cx="606.3" cy="248.3" r="6.5"/><path class="leader-halo" d="M414.0 428.8 L448.0 428.8 L564.4 428.8"/><path class="leader" d="M414.0 428.8 L448.0 428.8 L564.4 428.8"/><circle class="leader-dot" cx="564.4" cy="428.8" r="6.5"/><g class="callout" transform="translate(1200.0 480.4)"><text class="label label-strong" text-anchor="start" direction="ltr"><tspan x="0" y="0">White arc · 41–85 KIAS</tspan></text><text class="label-small" text-anchor="start" direction="ltr"><tspan x="0" y="38.09">Full-flap operating range</tspan><tspan x="0" y="67.37">From V<tspan dy="4.8" font-size="17.28">S0</tspan><tspan dy="-4.8"> (stall, landing</tspan></tspan><tspan x="0" y="96.65">configuration) up to V<tspan dy="4.8" font-size="17.28">FE</tspan></tspan><tspan x="0" y="125.93">(flaps-extended limit)</tspan></text></g><g class="callout" transform="translate(1200.0 690.2)"><text class="label label-strong" text-anchor="start" direction="ltr"><tspan x="0" y="0">Green arc · 47–128 KIAS</tspan></text><text class="label-small" text-anchor="start" direction="ltr"><tspan x="0" y="38.09">Normal operating range</tspan><tspan x="0" y="67.37">From V<tspan dy="4.8" font-size="17.28">S1</tspan><tspan dy="-4.8"> (stall, flaps up)</tspan></tspan><tspan x="0" y="96.65">up to V<tspan dy="4.8" font-size="17.28">NO</tspan><tspan dy="-4.8"> (maximum</tspan></tspan><tspan x="0" y="125.93">structural cruising speed)</tspan></text></g><path class="leader-halo" d="M1186.0 467.8 L1152.0 467.8 L1005.4 467.8"/><path class="leader" d="M1186.0 467.8 L1152.0 467.8 L1005.4 467.8"/><circle class="leader-dot" cx="1005.4" cy="467.8" r="6.5"/><path class="leader-halo" d="M1186.0 677.6 L1152.0 677.6 L826.3 676.5"/><path class="leader" d="M1186.0 677.6 L1152.0 677.6 L826.3 676.5"/><circle class="leader-dot" cx="826.3" cy="676.5" r="6.5"/></g><text class="label-small" text-anchor="middle" direction="ltr"><tspan x="800" y="892">Not marked on the dial: V<tspan dy="4.8" font-size="17.28">A</tspan><tspan dy="-4.8"> (manoeuvring speed) — 97 KIAS at 2300 lb</tspan></tspan></text></svg>
