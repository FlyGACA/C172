 824 q-9 13 0 20 q9 -7 0 -20z" fill="var(--fuel)"/><path d="M0 -15.3 L10.54 8.5 L-10.54 8.5 Z" class="arrow" transform="translate(800 866) rotate(180)"/><rect x="520" y="1030" width="560" height="102" rx="20" class="outline"/><rect x="712" y="916" width="176" height="118" rx="16" class="outline f-paper"/><path d="M760 930 q26 43 0 86 M840 930 q-26 43 0 86" class="outline-thin"/><line x1="783" y1="960" x2="817" y2="986" class="outline-thin" stroke-width="4.5"/><path d="M0 -11.700000000000001 L8.06 6.5 L-8.06 6.5 Z" class="arrow" transform="translate(1096 918) rotate(180)"/><rect x="1066" y="734" width="100" height="44" rx="8" class="outline f-paper"/><line x1="1166" y1="756" x2="1216" y2="756" class="outline-thin" stroke-width="7"/><circle cx="1234" cy="756" r="21" class="outline f-ink"/><line x1="318" y1="950" x2="388" y2="950" class="outline-thin" stroke-width="7"/><circle cx="300" cy="950" r="21" class="outline f-ink"/><line x1="318" y1="1000" x2="388" y2="1000" class="outline-thin" stroke-width="7"/><circle cx="300" cy="1000" r="21" class="outline f-limit"/></g><g><text class="label label-strong" text-anchor="middle" direction="ltr"><tspan x="335" y="262">Left fuel tank</tspan></text><text class="label-small" text-anchor="middle" direction="ltr"><tspan x="335" y="300">21.5 gal · 20 usable</tspan></text><text class="label label-strong" text-anchor="middle" direction="ltr"><tspan x="1265" y="262">Right fuel tank</tspan></text><text class="label-small" text-anchor="middle" direction="ltr"><tspan x="1265" y="300">21.5 gal · 20 usable</tspan></text><text class="label" text-anchor="middle" direction="ltr"><tspan x="310" y="112">Filler cap</tspan></text><text class="label" text-anchor="middle" direction="ltr"><tspan x="1290" y="112">Vented filler cap</tspan></text><text class="label" text-anchor="start" direction="ltr"><tspan x="249" y="364">Sump drain valve</tspan></text><text class="label-small" text-anchor="start" direction="ltr"><tspan x="249" y="394">one under each tank</tspan></text><text class="label" text-anchor="middle" direction="ltr"><tspan x="800" y="62">Vent crossover line</tspan></text><text class="label" text-anchor="start" direction="ltr"><tspan x="44" y="478">Overboard vent with check valve</tspan></text><text class="label-small" text-anchor="start" direction="ltr"><tspan x="44" y="508">under the left wing, behind the strut</tspan></text><text class="label" text-anchor="middle" direction="ltr"><tspan x="800" y="318">Fuel quantity indicators</tspan></text><text class="label-small" text-anchor="middle" direction="ltr"><tspan x="800" y="348">float transmitter in each tank</tspan></text><text class="label" text-anchor="end" direction="ltr"><tspan x="648" y="628">Fuel selector valve</tspan></text><text class="label-small" text-anchor="end" direction="ltr"><tspan x="648" y="658">shown on BOTH</tspan></text><text class="label" text-anchor="end" direction="ltr"><tspan x="648" y="748">Fuel strainer</tspan></text><text class="label-small" text-anchor="end" direction="ltr"><tspan x="648" y="822">Strainer drain</tspan></text><text class="label" text-anchor="start" direction="ltr"><tspan x="910" y="960">Carburetor</tspan></text><text class="label label-strong" text-anchor="middle" direction="ltr"><tspan x="800" y="1080">Engine</tspan></text><text x="800" y="1112" class="label-small" text-anchor="middle" direction="ltr">Lycoming O-320-H2AD</text><text class="label" text-anchor="middle" direction="ltr"><tspan x="1146" y="712">Primer</tspan></text><text class="label-small" text-anchor="start" direction="ltr"><tspan x="1120" y="908">to the cylinder</tspan><tspan x="1120" y="937.28">intake ports</tspan></text><text class="label" text-anchor="end" direction="ltr"><tspan x="262" y="960">Throttle</tspan></text><text class="label" text-anchor="end" direction="ltr"><tspan x="262" y="1010">Mixture</tspan></text><rect x="1128" y="394" width="432" rx="14" class="note-box" height="220.39999999999986"/><circle cx="1156" cy="434" r="5" fill="