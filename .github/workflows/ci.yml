name: CI

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:

concurrency:
  group: c172-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Trusted work uses the isolated C172 runner. Fork PRs stay GitHub-hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'c172-ci' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify archived phase packages (SHA256SUMS.txt)
        run: sed 's#  README.md$#  docs/archive/UPLOAD_PACKAGE_README.md#' SHA256SUMS.txt | sha256sum -c --quiet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the Phase 7 GLB and compare with the committed file
        run: |
          python -m pip install --quiet "numpy>=1.26" "pillow>=10"
          python 07_kinematic_twin/build/verify_model.py
      - name: Phase 8 pure-Python tests and GLB structure validation
        run: |
          python 08_realistic_digital_twin/tests/test_profiles.py
          python 08_realistic_digital_twin/scripts/validate_glb.py
          python 08_realistic_digital_twin/scripts/quality_gate.py
      - name: Book figures — ink-line rules (numpy only)
        run: python 09_book_figures/tests/test_ink.py

      - name: Verify release archive and checksums
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (kinematics, systems simulation, scenarios — Phase 7 and Phase 8 copies)
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Book figures — build every figure in both languages (fails if any text runs off a figure)
        run: node 09_book_figures/build.mjs --out "$RUNNER_TEMP/book-figures"
      - name: Browser test — Phase 7 viewer
        run: npm run test:e2e
        env:
          E2E_SHOTS: e2e-screenshots/phase7
      - name: Browser test — Phase 8 realistic twin (high/medium/low, phone width, Arabic RTL)
        run: npm run test:e2e8
        env:
          E2E_SHOTS: e2e-screenshots/phase8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  blender-rebuild:
    # Rebuilds the Phase 8 model from the scripts with the pinned Blender LTS and checks that the
    # result has the same parts and triangle counts as the committed GLBs (deterministic build).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'c172-ci' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "numpy>=1.26" "pillow>=10"
      - name: Cache Blender 4.5 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/flygaca-blender
          key: blender-4.5.15-linux-x64
      - name: Download Blender
        run: 08_realistic_digital_twin/scripts/get_blender.sh
      - name: Regenerate textures and rebuild the model (all quality levels)
        run: |
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 > /dev/null
          cd 08_realistic_digital_twin/blender && python -m c172.textures ../assets && cd ../..
          "$(08_realistic_digital_twin/scripts/get_blender.sh)" -b --python 08_realistic_digital_twin/blender/build.py -- --lod all --skip-textures --out /tmp/p8models
      - name: Compare the rebuilt model with the committed one
        run: python 08_realistic_digital_twin/scripts/compare_builds.py 08_realistic_digital_twin/models /tmp/p8models
      - name: Validate geometry and critical fuselage attachments
        run: |
          "$(08_realistic_digital_twin/scripts/get_blender.sh)" -b /tmp/p8models/C172N_realistic.blend \
            --python 08_realistic_digital_twin/blender/validate_geometry.py
      - name: Render visual-regression views
        run: |
          "$(08_realistic_digital_twin/scripts/get_blender.sh)" -b /tmp/p8models/C172N_realistic.blend \
            --python 08_realistic_digital_twin/blender/render_preview.py -- \
            --out /tmp/p8renders --samples 16 --views front_quarter,gear_detail,top --res 800x450 --no-denoise
      - name: Compare canonical renders
        run: |
          python 08_realistic_digital_twin/scripts/compare_renders.py \
            08_realistic_digital_twin/docs/renders /tmp/p8renders \
            phase8_front_quarter.png phase8_gear_detail.png phase8_top.png \
            --diff-dir /tmp/p8render-diffs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phase8-render-diffs
          path: /tmp/p8render-diffs
          if-no-files-found: ignore
